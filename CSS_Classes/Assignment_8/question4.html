<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Practice</title>
    <link rel="stylesheet" href="question4.css">
</head>
<body>

    <header>
        <h1>CSS Selectors Practice</h1>
    </header>

    <main>
        <section>
            <p>Element selector example</p>

            <p class="highlight">Class selector example</p>

            <p id="special">ID selector example</p>

            <a href="https://example.com">Attribute selector example</a>

            <div class="parent">
                <p>Descendant selector example</p>
                <div>
                    <p>Nested paragraph</p>
                </div>
            </div>

            <ul>
                <li>First Item</li>
                <li>Second Item</li>
            </ul>

            <p class="next">Paragraph after the list</p>

            <p class="sibling">Another paragraph</p>
        </section>
    </main>

    <footer>
        <p>CSS Selectors Practice</p>
    </footer>

</body>
</html>
