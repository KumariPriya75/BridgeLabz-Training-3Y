<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <link rel="stylesheet" href="question1.css">
</head>
<body>

    <header>
        <h1>Pseudo-Classes Demonstration</h1>
    </header>

    <main>
        <section class="examples">

            <div class="example">
                <a href="#">Hover Link</a>
                <p>:hover changes the link color when the mouse is over it.</p>
            </div>

            <div class="example">
                <button>Focus Button</button>
                <p>:focus changes the button when it is selected.</p>
            </div>

            <div class="example">
                <button>Active Button</button>
                <p>:active changes the button while it is being clicked.</p>
            </div>

            <div class="example">
                <ul>
                    <li>First Item</li>
                    <li>Second Item</li>
                    <li>Third Item</li>
                </ul>
                <p>:nth-child() changes a specific list item.</p>
            </div>

        </section>
    </main>

</body>
</html>
