<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img src="https://picsum.photos/300/200?random=1" alt="Image 1">
                <figcaption>Image One</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?random=2" alt="Image 2">
                <figcaption>Image Two</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?random=3" alt="Image 3">
                <figcaption>Image Three</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?random=4" alt="Image 4">
                <figcaption>Image Four</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?random=5" alt="Image 5">
                <figcaption>Image Five</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?random=6" alt="Image 6">
                <figcaption>Image Six</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
