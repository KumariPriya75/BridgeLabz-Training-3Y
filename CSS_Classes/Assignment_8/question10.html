<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="question10.css">
</head>
<body>

    <header>
        <h1>Mini User Interface</h1>
    </header>

    <main>
        <section class="card">

            <img src="https://picsum.photos/200/120" alt="Sample Image">

            <form>
                <input type="text" placeholder="Enter your name">
                <input type="email" placeholder="Enter your email">

                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>
            </form>

        </section>
    </main>

    <footer>
        <p>Mini User Interface</p>
    </footer>

</body>
</html>
