<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Inline Formatting</title>
</head>
<body>
    <p>
        <strong>Learning HTML</strong> is an <em>exciting</em> journey that helps
        me understand how websites are created. I believe that
        <mark>practice</mark> is the key to improving my coding skills.<br>
        I will keep learning and <strong>building new projects</strong> every day.
        <small>Keep learning and never give up!</small>
    </p>
</body>
</html>
