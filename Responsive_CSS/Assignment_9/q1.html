
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Explore different CSS image filters</p>
    </header>

    <!-- Main content -->
    <main>
        <section class="gallery">

            <!-- Image 1: Blur -->
            <figure class="gallery-item">
                <img src="https://tse4.mm.bing.net/th/id/OIP.M_Fo7pbRNvHGkRDFgi5IigHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                     alt="Beautiful Bali beach"
                     class="blur">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <!-- Image 2: Grayscale -->
            <figure class="gallery-item">
                <img src="https://tse4.mm.bing.net/th/id/OIP.ap7bUqr8Rw5dQE0JTozTrwHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                     alt="Peaceful beach"
                     class="grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <!-- Image 3: Sepia -->
            <figure class="gallery-item">
                <img src="https://i.pinimg.com/originals/35/33/ad/3533adba2e1983f7c8b9809e1d2b82ea.jpg"
                     alt="Paris city view"
                     class="sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <!-- Image 4: Brightness -->
            <figure class="gallery-item">
                <img src="https://th.bing.com/th/id/R.dcc4cfbcc618c3e3ef78f8eeee67645d?rik=ZSx4uQcKiyOv6Q&riu=http%3a%2f%2fwww.guideoftheworld.com%2fwp-content%2fuploads%2fphotos%2flauterbrunnen_bernese_oberland_switzerland.jpg&ehk=F%2fIckXZNj1fq9wm1JmGsej9sD7zE4bLXAUHt0qZVHrk%3d&risl=&pid=ImgRaw&r=0"
                     alt="Swiss mountains"
                     class="brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <!-- Image 5: Contrast -->
            <figure class="gallery-item">
                <img src="https://tse1.mm.bing.net/th/id/OIP.eOiyVvoqhAtZMEnGUduMIQHaEO?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                     alt="Travel destination"
                     class="contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <!-- Image 6: Hue Rotate -->
            <figure class="gallery-item">
                <img src="https://i.pinimg.com/originals/4c/33/28/4c332881208b7d2276e20903851a1518.jpg"
                     alt="Tropical destination"
                     class="hue-rotate">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Image Filter Gallery</p>
    </footer>

</body>
</html>
