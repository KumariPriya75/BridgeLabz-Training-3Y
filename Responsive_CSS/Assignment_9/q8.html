
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <header>
        <h1>Image Comparison</h1>
        <p>Compare normal and filtered images</p>
    </header>

    <main class="comparison-container">

        <section class="image-card">
            <img src="https://tse4.mm.bing.net/th/id/OIP.M_Fo7pbRNvHGkRDFgi5IigHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Normal Bali image">
            <h2>Original Image</h2>
            <p>This image is displayed without any filter.</p>
        </section>

        <section class="image-card">
            <img class="filtered-image"
                 src="https://tse4.mm.bing.net/th/id/OIP.M_Fo7pbRNvHGkRDFgi5IigHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                 alt="Filtered Bali image">
            <h2>Filtered Image</h2>
            <p>This image uses a grayscale filter.</p>
        </section>

    </main>

    <footer>
        <p>Responsive Image Design</p>
    </footer>

</body>
</html>
