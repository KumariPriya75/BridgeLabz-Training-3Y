<head>

<style>body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:0 12px}button{margin-top:14px;padding:8px 14px}label{display:block;margin-top:12px}input{display:block;padding:8px;width:100%;box-sizing:border-box}.error{color:red}.valid{border:2px solid green}.invalid{border:2px solid red}</style>
