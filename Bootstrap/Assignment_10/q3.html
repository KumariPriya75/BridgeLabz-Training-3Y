<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q3.css">
</head>
<body>
  <header class="text-center py-4 bg-light">
    <h1>Our Products</h1>
  </header>

  <main class="container my-4">
    <!-- row and col-md-3 for 4-column grid, col-6 on mobile, col-md-3 shows 4 per row, tablets adjust via col-sm-6 -->
    <div class="row g-4">
      <div class="col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://via.placeholder.com/200" class="card-img-top" alt="Backpack">
          <div class="card-body text-center">
            <h5 class="card-title">Travel Backpack</h5>
            <p class="card-text">$45.00</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://via.placeholder.com/200" class="card-img-top" alt="Headphones">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="card-text">$89.00</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://via.placeholder.com/200" class="card-img-top" alt="Watch">
          <div class="card-body text-center">
            <h5 class="card-title">Smart Watch</h5>
            <p class="card-text">$120.00</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://via.placeholder.com/200" class="card-img-top" alt="Shoes">
          <div class="card-body text-center">
            <h5 class="card-title">Running Shoes</h5>
            <p class="card-text">$60.00</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
