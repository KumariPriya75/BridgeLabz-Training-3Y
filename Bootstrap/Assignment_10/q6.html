<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q6.css">
</head>
<body>
  <header class="text-center py-4">
    <h1>Notifications</h1>
  </header>

  <main class="container mb-5">
    <div class="card p-3">
      <!-- Contextual alerts -->
      <div class="alert alert-success" role="alert">
        New message received from your project mentor.
      </div>
      <div class="alert alert-info" role="alert">
        Tip: Complete your profile to unlock more features.
      </div>
      <!-- Dismissible alert -->
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        Warning: Your subscription expires in 2 days.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- Summary well -->
      <div class="bg-light p-3 border rounded">
        <h5>Summary</h5>
        <p class="mb-0">You have 1 new message, 1 tip, and 1 warning today.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
