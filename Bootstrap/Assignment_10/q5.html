<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Read - Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <header class="text-center bg-primary text-white py-4">
    <h1>The Daily Read</h1>
    <p>Stories worth your time</p>
  </header>

  <main class="container my-5">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card">
          <img src="https://via.placeholder.com/400x200" class="card-img-top" alt="Blog post 1">
          <div class="card-body">
            <h5 class="card-title">Traveling on a Budget</h5>
            <p class="card-text">Simple tips to explore more while spending less.</p>
            <button class="btn btn-primary">Read More</button>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <img src="https://via.placeholder.com/400x200" class="card-img-top" alt="Blog post 2">
          <div class="card-body">
            <h5 class="card-title">Learning to Code in 2026</h5>
            <p class="card-text">A beginner's roadmap to becoming a developer.</p>
            <button class="btn btn-primary">Read More</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center bg-primary text-white py-3">
    <p class="mb-0">&copy; 2026 The Daily Read</p>
  </footer>
</body>
</html>
