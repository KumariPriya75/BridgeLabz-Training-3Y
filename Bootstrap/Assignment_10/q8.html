<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <header class="text-center py-4">
    <h1>Choose Your Plan</h1>
  </header>

  <main class="container mb-5">
    <div class="row g-4 justify-content-center">
      <div class="col-md-4">
        <div class="card pricing-card shadow-sm h-100 text-center">
          <div class="card-body">
            <h4 class="card-title">Basic</h4>
            <p class="display-6">$9/mo</p>
            <ul class="list-unstyled">
              <li>5 Projects</li>
              <li>Email Support</li>
              <li>1 GB Storage</li>
            </ul>
            <button class="btn btn-outline-primary">Choose Plan</button>
          </div>
        </div>
      </div>
      <!-- Highlighted Pro plan -->
      <div class="col-md-4">
        <div class="card pricing-card shadow-sm h-100 text-center bg-primary text-white">
          <div class="card-body">
            <h4 class="card-title">Pro</h4>
            <p class="display-6">$29/mo</p>
            <ul class="list-unstyled">
              <li>Unlimited Projects</li>
              <li>Priority Support</li>
              <li>50 GB Storage</li>
            </ul>
            <button class="btn btn-light">Choose Plan</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card pricing-card shadow-sm h-100 text-center">
          <div class="card-body">
            <h4 class="card-title">Enterprise</h4>
            <p class="display-6">$99/mo</p>
            <ul class="list-unstyled">
              <li>Unlimited Everything</li>
              <li>24/7 Support</li>
              <li>500 GB Storage</li>
            </ul>
            <button class="btn btn-outline-primary">Choose Plan</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
