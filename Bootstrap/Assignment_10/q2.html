<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumari Priya - Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <header class="text-center bg-light p-5">
    <h1 class="fw-bold">Kumari Priya</h1>
    <p class="text-dark">B.Tech Computer Science Student | Frontend Developer</p>
  </header>

  <main class="container text-center mt-4">
    <!-- Profile image with rounded-circle and img-fluid -->
    <img src="https://via.placeholder.com/180" alt="Profile photo" class="img-fluid rounded-circle mb-3">

    <div class="mb-4">
      <button class="btn btn-primary mt-4 mb-3">Hire Me</button>
      <button class="btn btn-outline-secondary mt-4 mb-3">Download CV</button>
    </div>

    <!-- Contact form -->
    <section class="mb-5">
      <h3 class="mb-3">Contact Me</h3>
      <form class="w-50 mx-auto">
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Your Name">
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Your Email">
        </div>
        <div class="mb-3">
          <textarea class="form-control" rows="3" placeholder="Your Message"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
