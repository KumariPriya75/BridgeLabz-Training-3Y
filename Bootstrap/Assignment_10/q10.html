<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore With Us - Travel Agency</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q10.css">
</head>
<body>
  <header class="text-center py-4">
    <h1>Explore With Us</h1>
  </header>

  <main class="container mb-5">
    <!-- Carousel with custom interval per slide -->
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="4000">
          <img src="https://via.placeholder.com/900x400" class="d-block w-100" alt="Goa Beach">
          <div class="carousel-caption d-none d-md-block">
            <h5>Goa Beaches</h5>
            <p>Sun, sand, and endless fun.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="4000">
          <img src="https://via.placeholder.com/900x400" class="d-block w-100" alt="Manali Mountains">
          <div class="carousel-caption d-none d-md-block">
            <h5>Manali Mountains</h5>
            <p>Snow-capped peaks and cool air.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="4000">
          <img src="https://via.placeholder.com/900x400" class="d-block w-100" alt="Jaipur Fort">
          <div class="carousel-caption d-none d-md-block">
            <h5>Jaipur Forts</h5>
            <p>Royal history at every corner.</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- Progress bar for booking completion -->
    <h5 class="mt-4">Booking Progress</h5>
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 70%">70%</div>
    </div>
  </main>

  <footer class="text-center bg-dark text-white py-3">
    <p class="mb-0">Contact us: info@explorewithus.com | +91 98765 43210</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
