<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q7.css">
</head>
<body>
  <header class="container d-flex justify-content-between align-items-center py-3">
    <h1>My Tasks</h1>
    <!-- Badge counter for pending tasks -->
    <span class="badge bg-secondary fs-6">3 Pending</span>
  </header>

  <main class="container mb-5">
    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Finish assignment report
        <span class="badge bg-danger">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Review teammate's code
        <span class="badge bg-warning text-dark">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Update project README
        <span class="badge bg-success">Low</span>
      </li>
    </ul>

    <!-- Completed button with embedded badge -->
    <button class="btn btn-outline-success mt-4">
      Completed <span class="badge bg-success">5</span>
    </button>
  </main>
</body>
</html>
