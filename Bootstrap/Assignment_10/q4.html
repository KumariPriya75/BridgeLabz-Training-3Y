<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q4.css">
</head>
<body>
  <header class="text-center py-4">
    <h1>Today's Menu</h1>
    <p class="lead">Fresh dishes made daily</p>
  </header>

  <main class="container mb-5">
    <!-- Bootstrap table for menu items -->
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Item</th>
          <th>Category</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Paneer Tikka</td>
          <td>Starter</td>
          <td>$6.00</td>
        </tr>
        <tr>
          <td>Butter Chicken</td>
          <td>Main Course</td>
          <td>$12.00</td>
        </tr>
        <tr>
          <td>Veg Biryani</td>
          <td>Main Course</td>
          <td>$9.00</td>
        </tr>
        <tr>
          <td>Gulab Jamun</td>
          <td>Dessert</td>
          <td>$4.00</td>
        </tr>
      </tbody>
    </table>

    <!-- List group for Chef's Specials -->
    <h3 class="mt-4">Chef's Specials</h3>
    <ul class="list-group mb-4">
      <li class="list-group-item">Tandoori Platter</li>
      <li class="list-group-item">Hyderabadi Dum Biryani</li>
      <li class="list-group-item">Chocolate Lava Cake</li>
    </ul>

    <div class="text-center">
      <img src="https://via.placeholder.com/400x250" class="img-fluid" alt="Special dish">
      <p class="text-center mt-2">Our signature Tandoori Platter</p>
    </div>
  </main>
</body>
</html>
