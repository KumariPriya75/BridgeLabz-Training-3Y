<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Report</title>
</head>
<body>

  <h1>GLA University Public School</h1>

  <h2>Student Report Card</h2>

  <table border="1">
    <thead>
      <tr>
        <th colspan="2" title="Student's academic performance report">Report Card - Class X</th>
      </tr>
      <tr>
        <th>Subject</th>
        <th>Marks Obtained (out of 100)</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td title="English Language and Literature">English</td>
        <td>85</td>
      </tr>
      <tr>
        <td title="Mathematics - Algebra, Geometry, Trigonometry">Mathematics</td>
        <td>92</td>
      </tr>
      <tr>
        <td title="Physics, Chemistry, Biology combined">Science</td>
        <td>88</td>
      </tr>
      <tr>
        <td title="History, Geography, Civics">Social Science</td>
        <td>79</td>
      </tr>
      <tr>
        <td title="Computer Science and Programming Basics">Computer Science</td>
        <td>95</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td title="Sum of marks obtained in all 5 subjects">Total</td>
        <td>439 / 500</td>
      </tr>
      <tr>
        <td title="Overall percentage based on total marks">Percentage</td>
        <td>87.8%</td>
      </tr>
      <tr>
        <td colspan="2" title="Final remark by class teacher">
          Remarks: Excellent performance, keep up the good work!
        </td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
