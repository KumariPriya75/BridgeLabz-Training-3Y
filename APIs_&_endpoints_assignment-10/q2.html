<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Employee Status Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 15px; }
        .employee { display: flex; justify-content: space-between; align-items: center; padding: 13px; margin: 9px 0; background: #f2f5f8; border-radius: 7px; }
        .status { font-weight: bold; }
        .active { color: green; }
        .inactive { color: #b33; }
        button { padding: 8px 12px; cursor: pointer; }
        #message { color: #b33; }
    </style>
</head>
<body>
    <main>
        <h1>Employee Status Dashboard</h1>
        <p id="message" role="alert"></p>
        <section id="employees">Loading employees...</section>
    </main>
    <script src="q2.js"></script>
</body>
</html>
