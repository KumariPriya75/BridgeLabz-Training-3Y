<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - User Registration</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 35px auto; padding: 15px; background: #f5f7fa; }
        form { background: white; padding: 24px; border-radius: 9px; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; }
        button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
        #message { font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <h1>User Registration</h1>
        <form id="registration">
            <label for="name">Name</label>
            <input type="text" id="name" required>
            <label for="email">Email</label>
            <input type="email" id="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" minlength="8" required>
            <button type="submit">Register</button>
            <p id="message" role="status"></p>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="q6.js"></script>
</body>
</html>
