<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 - Multi-API Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 35px auto; padding: 15px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .card { padding: 25px; background: #eef3fa; border-radius: 9px; text-align: center; }
        .number { font-size: 32px; font-weight: bold; color: #245b9e; }
        .skeleton { height: 35px; width: 70px; margin: 12px auto; background: linear-gradient(90deg, #ddd, #f5f5f5, #ddd); border-radius: 5px; }
        #warning { color: #a45c00; }
    </style>
</head>
<body>
    <main>
        <h1>Multi-API Dashboard</h1>
        <p id="warning" role="alert"></p>
        <section class="dashboard">
            <article class="card"><h2>Total Users</h2><div id="users" class="skeleton"></div></article>
            <article class="card"><h2>Total Orders</h2><div id="orders" class="skeleton"></div></article>
            <article class="card"><h2>Total Products</h2><div id="products" class="skeleton"></div></article>
        </section>
    </main>
    <script src="q4.js"></script>
</body>
</html>
