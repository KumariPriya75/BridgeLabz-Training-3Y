<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
<form>
<table border="1" cellpadding="10" cellspacing="0" width="700" align="center">
<tr>
    <th colspan="2">Registration Form</th>
</tr>
<tr>
    <td width="150">Full Name</td>
    <td>
      <input type="text" name="fullname" placeholder="Enter your name" size="30">
    </td>
</tr>
<tr>
    <td>Email</td>
    <td>
      <input type="email" name="email" placeholder="abc@gmail.com" size="30">
    </td>
  </tr>  
<tr>
    <td>Phone Number</td>
    <td>
      <input type="text" name="phone" placeholder="9876543210" size="30">
    </td>
  </tr>
<tr>
    <td>Date of Birth</td>
    <td>
      <input type="date" name="dob">
    </td>
  </tr>
<tr>
    <td>Gender</td>
    <td>
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
      <input type="radio" name="gender" value="other"> Other
    </td>
  </tr>  
<tr>
    <td>Skills</td>
    <td>
      <input type="checkbox" name="skills" value="html"> HTML
      <input type="checkbox" name="skills" value="css"> CSS
      <input type="checkbox" name="skills" value="javascript"> JavaScript
    </td>
  </tr>
<tr>
    <td>Course</td>
    <td>
      <select name="course">
        <option>--Select Course--</option>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>MCA</option>
        <option>Diploma</option>
      </select>
    </td>
  </tr>  
<tr>
    <td>Address</td>
    <td>
      <textarea name="address" rows="4" cols="35"></textarea>
    </td>
  </tr>
<tr>
    <td>Upload Resume</td>
    <td>
      <input type="file" name="resume">
    </td>
  </tr>  
<tr>
    <td colspan="2" align="center">
      <input type="submit" value="Register">
      <input type="reset" value="Reset">
    </td>
  </tr>
</table>
</body>
</html>
