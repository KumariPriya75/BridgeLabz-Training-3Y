<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <div class="avatar">Student</div>

    <h1 class="name">Rahul Sharma</h1>
    <h2 class="department">Computer Science Engineering</h2>
    <p class="institute">ABC Institute of Technology</p>

    <p class="bio">
      I am a passionate Computer Science student interested in Web
      Development, Java, and problem solving.
    </p>

    <h3 class="skills-title">Skills</h3>
    <div class="skills">
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">Java</span>
      <span class="skill">Problem Solving</span>
    </div>

    <button class="contact-btn">Contact Me</button>
  </div>

</body>
</html>
