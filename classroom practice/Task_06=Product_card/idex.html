<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>

    <div class="container">

        <div class="box">
             <div class="card">

                <div class="box1"><h3 class="discount" text-align="center">20% OFF</h3></div>

               <img src="https://cdn.clippingpath.in/wp-content/uploads/2020/03/Original-Image.jpg" alt="Premium Running Shoes" width="400"> 

             </div>

            <div class="heart"><span><i class="fa-regular fa-heart"></i></span></div>

            <h2>SPORTS SHOES</h2>
            <h2>Premium Running Shoes</h2>

            <div class="container1">
            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i> (120)
            </div>
            
            <p class="price">&#8377;1,999 <del>&#8377;2,499</del></p>
            
            <button class="btn">Add to Cart</button>
        </div>

    </div>
</body>
</html>
