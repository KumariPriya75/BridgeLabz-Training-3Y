<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 2 - Embed Google Map</title>
</head>
<body>

    <h1>My City on Google Maps</h1>

    <!--    Explanation of loading="lazy":
    The "loading" attribute set to "lazy" tells the browser to delay
    loading the iframe's content (the map) until the user scrolls
    near it on the page. This improves the page's initial load speed
    and saves bandwidth, since the map is not loaded immediately
    when the page opens.-->
<iframe
    title="Google Map of Mathura City"
    src="https://www.google.com/maps?q=Mathura,Uttar%20Pradesh,India&output=embed"
    width="600"
    height="450"
    loading="lazy">
</iframe>

</body>
</html>
