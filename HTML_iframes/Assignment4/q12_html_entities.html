<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 12 - HTML Entities</title>
</head>
<body>
    <h1>Displaying Special Characters Using HTML Entities</h1>
    <p>
       This is a Less than: &lt; <br>
       This is a Greater than: &gt; <br>
       This is an Ampersand: &amp; <br>
       This is a Double quote: &quot; <br>
       This is a Single quote: &apos; <br>
    </p>
    <p>
        This is a Copyright symbol: &copy; <br>
        This is a Trademark symbol: &trade; <br>
        This is a Registered symbol: &reg;
    </p>

</body>
</html>
