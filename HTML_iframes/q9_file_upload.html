<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 9 - File Upload Form</title>
</head>
<body>

    <h1>Upload Your Image</h1>

    <p>Only .jpg and .png image files are allowed for upload.</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <label for="fileupload">Choose an image:</label>
        <input type="file" id="fileupload" name="fileupload" accept=".jpg,.png" required><br><br>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
