<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 7 - Login Form</title>
</head>
<body>

    <h1>Login Form</h1>

    <form action="#" method="post">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <!--
            A CSRF token is a unique, secret value generated by the server
            and embedded in the form. It proves the request came from the
            legitimate form and not from a malicious site tricking the
            user's browser into submitting an unwanted request.
        -->
        <input type="hidden" name="csrf_token" value="dummy_csrf_token_12345">

        <input type="submit" value="Login">

    </form>

</body>
</html>
