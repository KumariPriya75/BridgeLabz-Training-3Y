<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 12 - HTML Entities</title>
</head>
<body>

    <h1>Displaying Special Characters Using HTML Entities</h1>

    <p>
        Less than: &lt; <br>
        Greater than: &gt; <br>
        Ampersand: &amp; <br>
        Double quote: &quot; <br>
        Single quote: &apos; <br>
    </p>

    <p>
        Copyright symbol: &copy; <br>
        Trademark symbol: &trade; <br>
        Registered symbol: &reg;
    </p>

</body>
</html>
