<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <main class="container">

        <div class="card">

            <div class="card-inner">

                <div class="card-front">
                    <img src="https://wallpaperaccess.com/full/165666.jpg" alt="Nature">
                    <h2>Nature</h2>
                </div>

                <div class="card-back">
                    <h2>About Nature</h2>
                    <p>
                        Nature includes everything around us such as
                        plants, animals, mountains, rivers and forests.
                    </p>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
