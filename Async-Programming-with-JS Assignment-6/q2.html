<!DOCTYPE html>
<html>
<head>
    <title>Q2 - Microtasks vs Macrotasks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 30px;
            color: #222;
        }
        h2 { color: #333; }
        pre {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h2>Q2 - Microtasks vs Macrotasks</h2>
    <pre id="output"></pre>
    <script>
const output = document.getElementById("output");

function log(message) {
    console.log(message);
    output.textContent += message + "\\n";
}

log("Start");

// setTimeout callback is a macrotask.
setTimeout(() => log("setTimeout callback"), 0);

// Promise.then callback is a microtask.
Promise.resolve().then(() => log("Promise callback"));

log("Synchronous log");
log("End");

// Microtasks run after synchronous code and before the next macrotask.
// Therefore, the Promise callback appears before setTimeout callback.
    </script>
</body>
</html>
