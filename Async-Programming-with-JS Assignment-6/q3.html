<!DOCTYPE html>
<html>
<head>
    <title>Q3 - Bug Tracker: Callback to Promise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 30px;
            color: #222;
        }
        h2 { color: #333; }
        pre {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h2>Q3 - Bug Tracker: Callback to Promise</h2>
    <pre id="output"></pre>
    <script>
const output = document.getElementById("output");

function log(message) {
    output.textContent += message + "\\n";
}

// Promise-based replacement of the callback function.
function getBugs() {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            let apiFailed = Math.random() < 0.3;

            if (apiFailed) {
                reject("Bug API request failed.");
            } else {
                resolve(["UI glitch", "API timeout", "Login failure"]);
            }
        }, 1000);
    });
}

getBugs()
    .then(bugs => {
        log("Bugs found:");
        console.table(bugs);
        bugs.forEach((bug, index) => log((index + 1) + ". " + bug));
    })
    .catch(error => log("Error: " + error));
    </script>
</body>
</html>
