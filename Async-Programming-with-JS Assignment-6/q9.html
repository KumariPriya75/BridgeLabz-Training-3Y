<!DOCTYPE html>
<html>
<head>
    <title>Q9 - Debugging the Event Loop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 30px;
            color: #222;
        }
        h2 { color: #333; }
        pre {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h2>Q9 - Debugging the Event Loop</h2>
    <pre id="output"></pre>
    <script>
const output = document.getElementById("output");

function log(message) {
    output.textContent += message + "\\n";
    console.log(message);
}

// Predicted output:
// Script start
// Script end
// Promise callback
// Timeout callback

log("Script start");

setTimeout(() => log("Timeout callback"), 0);

Promise.resolve().then(() => log("Promise callback"));

log("Script end");

// Synchronous code runs first. Promise callbacks are microtasks,
// so they run before setTimeout macrotasks.
    </script>
</body>
</html>
