<!DOCTYPE html>
<html>
<head>
    <title>Q8 - Order Processing Retry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 30px;
            color: #222;
        }
        h2 { color: #333; }
        pre {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h2>Q8 - Order Processing Retry</h2>
    <pre id="output"></pre>
    <script>
const output = document.getElementById("output");

function log(message) {
    output.textContent += message + "\\n";
}

function submitOrder() {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            if (Math.random() < 0.5) {
                reject("Order request failed");
            } else {
                resolve("Order submitted");
            }
        }, 700);
    });
}

async function processOrder() {
    for (let attempt = 1; attempt <= 3; attempt++) {
        try {
            await submitOrder();
            log("Attempt " + attempt + ": Success");
            return;
        } catch (error) {
            log("Attempt " + attempt + ": Failed");
        }
    }

    throw new Error("Order could not be processed");
}

processOrder()
    .then(() => log("Order processing finished."))
    .catch(error => log(error.message));
    </script>
</body>
</html>
