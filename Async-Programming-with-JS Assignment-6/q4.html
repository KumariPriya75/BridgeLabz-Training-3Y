<!DOCTYPE html>
<html>
<head>
    <title>Q4 - Async Timeout Race</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 30px;
            color: #222;
        }
        h2 { color: #333; }
        pre {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h2>Q4 - Async Timeout Race</h2>
    <pre id="output"></pre>
    <script>
const output = document.getElementById("output");

function log(message) {
    output.textContent += message + "\\n";
}

function deployServer(name, delay) {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            if (Math.random() < 0.2) {
                reject(name + " deployment failed.");
            } else {
                resolve(name + " responded.");
            }
        }, delay);
    });
}

const serverA = deployServer("Server A", 2000);
const serverB = deployServer("Server B", 3000);

Promise.all([serverA, serverB])
    .then(() => log("Deployment completed for all servers"))
    .catch(error => log("Promise.all error: " + error));

// Promise.race gives the result of the first settled Promise.
Promise.race([
    deployServer("Server A", 2000),
    deployServer("Server B", 3000)
])
    .then(result => log("Fastest response: " + result))
    .catch(error => log("Race error: " + error));
    </script>
</body>
</html>
