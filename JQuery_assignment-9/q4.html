<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 - Special Offers</title>
    <style>
        body { font-family: Arial; padding: 25px; }
        .banner { padding: 22px; margin: 10px 0; color: white; background: #2867a8; border-radius: 8px; }
        .banner:nth-of-type(2) { background: #23845b; }
        .banner:nth-of-type(3) { background: #a45c20; }
        .banner:nth-of-type(4) { background: #744a9c; }
        button { margin: 4px; padding: 8px 12px; }
    </style>
</head>
<body>
    <h1>Special Offers</h1>
    <div id="banners">
        <div class="banner"><h2>Offer 1 - Summer Sale</h2><p>Up to 40% off on selected items.</p></div>
        <div class="banner"><h2>Offer 2 - Student Deal</h2><p>Extra savings for students.</p></div>
        <div class="banner"><h2>Offer 3 - Weekend Special</h2><p>Buy more and save more.</p></div>
        <div class="banner"><h2>Offer 4 - New User Offer</h2><p>Get a welcome discount today.</p></div>
    </div>
    <button id="hide">Hide First</button><button id="show">Show All</button>
    <button id="up">Slide Up</button><button id="down">Slide Down</button>
    <button id="fadeOut">Fade Out</button><button id="fadeIn">Fade In</button>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="q4.js"></script>
</body>
</html>
