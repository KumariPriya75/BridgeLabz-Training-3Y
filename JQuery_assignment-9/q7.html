<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 - Search Courses</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 30px auto; }
        input { padding: 10px; width: 90%; }
        .course { padding: 12px; margin: 8px 0; background: #f0f3f7; }
        .match { background: yellow; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Find a Course</h1>
    <input type="text" id="search" placeholder="Search courses...">
    <button id="clear">Clear Search</button>
    <p id="count">Showing 5 courses</p>
    <div id="courses">
        <div class="course">HTML and CSS</div>
        <div class="course">Java Programming</div>
        <div class="course">Python for Beginners</div>
        <div class="course">Data Structures and Algorithms</div>
        <div class="course">Machine Learning</div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="q7.js"></script>
</body>
</html>
