<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Welcome Page</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 30px; background: #f2f6ff; }
        .box { background: white; padding: 25px; margin: 15px auto; max-width: 650px; border-radius: 10px; }
        button { padding: 10px 15px; margin: 6px; cursor: pointer; }
        #greeting { color: navy; }
    </style>
</head>
<body>
    <div class="box">
        <h1 id="greeting">Welcome!</h1>
        <p id="welcome">We are happy to have you here. Explore our website and enjoy your visit.</p>
        <button id="change">Change Greeting</button>
        <button id="toggle">Toggle Welcome Message</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="q1.js"></script>
</body>
</html>
