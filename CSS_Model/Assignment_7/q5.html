<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Attribute Selectors</h2>

            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Enter your email">

            <p>
                <a href="https://www.google.com">Secure Link</a>
            </p>
            <p>
                <a href="http://example.com">Normal Link</a>
            </p>
        </section>

        <section class="items">
            <h2>Item List</h2>

            <ul>
                <li>Apple</li>
                <li>Banana</li>
                <li>Orange</li>
                <li>Mango</li>
            </ul>

            <div class="content">
                <p>First paragraph inside the content.</p>
                <p>Second paragraph inside the content.</p>
            </div>

            <p>Paragraph after the content.</p>
            <p>Another paragraph after the content.</p>
        </section>
    </main>

    <footer>
        <p>CSS Selector Practice</p>
    </footer>

</body>
</html>
