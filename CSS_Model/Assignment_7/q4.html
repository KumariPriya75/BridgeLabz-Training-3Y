<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

    <header>
        <h1>Shadows and Depth Effects</h1>
    </header>

    <main>
        <section class="cards">

            <div class="card card1">
                <h2>Card One</h2>
                <p>This card has a simple box shadow.</p>
            </div>

            <div class="card card2">
                <h2>Card Two</h2>
                <p>This card has a darker shadow effect.</p>
            </div>

            <div class="card card3">
                <h2>Card Three</h2>
                <p>This card has a larger shadow for more depth.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Shadows Practice</p>
    </footer>

</body>
</html>
